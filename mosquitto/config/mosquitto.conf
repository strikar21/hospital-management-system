# =====================================================
# Hospital Management System - Mosquitto Configuration
# Certificate-Based Authentication (mTLS) - Day 4
# =====================================================
#
# SECURITY MODEL:
# - All devices authenticate with X.509 client certificates
# - Certificates signed by Hospital CA
# - Device identity extracted from certificate Common Name (CN)
# - ACL permissions based on device identity
# - No shared passwords
#
# =====================================================

# ==================
# LISTENERS
# ==================

# TLS Listener (Production) - Port 8883
listener 8883
protocol mqtt

# ==================
# TLS/SSL CONFIGURATION
# ==================

# Hospital CA certificate (to verify client certificates)
cafile /mosquitto/certs/hospital_ca.crt

# Server certificate and key (for TLS encryption)
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# REQUIRE CLIENT CERTIFICATES (mTLS)
# ✅ FINAL TEST: Re-enable certificate requirement to verify client cert is sent
# ✅ PRODUCTION SECURITY: Certificate required for all connections
require_certificate true

# Use certificate Common Name (CN) as MQTT username
# This allows ACL rules to use device_id from certificate
# ✅ FINAL TEST: Re-enable username extraction from cert CN
# ✅ PRODUCTION SECURITY: Username extracted from certificate CN
use_identity_as_username true

# TLS version (FORCE 1.2 ONLY - ESP32 does NOT support TLS 1.3)
# Setting both min and max to 1.2 disables TLS 1.3
tls_version tlsv1.2

# Cipher suites: Using OpenSSL defaults for maximum compatibility
# No cipher directive = uses default list (~30+ ciphers) which works for both
# ESP32 mbedTLS and Python OpenSSL

# ==================
# AUTHENTICATION
# ==================

# Disable anonymous connections
# ✅ FINAL TEST: Disable anonymous connections (certificate-based auth only)
# ✅ PRODUCTION SECURITY: No anonymous connections allowed
allow_anonymous false

# NO PASSWORD FILE NEEDED - authentication via certificates only
# password_file /mosquitto/config/passwords.txt  <- REMOVED

# ==================
# ACCESS CONTROL (ACLs)
# ==================

# ACL file for topic-level permissions
# Uses device_id (from certificate CN) for pattern-based access control
acl_file /mosquitto/config/acl.conf

# ==================
# SECURITY SETTINGS
# ==================

# Maximum connections
max_connections 100

# Connection timeout (30 seconds)
# Devices must complete TLS handshake within this time
# Prevents TLS exhaustion attacks
persistent_client_expiration 1h

# ==================
# RATE LIMITING
# ==================

# Maximum in-flight messages per client
max_inflight_messages 20

# Maximum queued messages per client
max_queued_messages 1000

# Maximum message size (100KB for ECG/EEG waveforms)
message_size_limit 102400

# ==================
# PERSISTENCE
# ==================

# Enable message persistence (survives broker restart)
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# ==================
# LOGGING
# ==================

# Log to stdout (Docker logs)
log_dest stdout

# Log types
log_type error
log_type warning
log_type notice
log_type information
log_type debug

# Log connections (important for security audit)
connection_messages true

# Log subscriptions (see what devices are subscribing to)
log_type subscribe

# Log unsubscriptions
log_type unsubscribe

# ==================
# PERFORMANCE
# ==================

# Keepalive timeout (maximum)
max_keepalive 65535

# Allow long-lived connections
# persistent_client_expiration 1d

# ==================
# BRIDGE CONFIGURATION (if needed)
# ==================

# Reserved for future use (e.g., cloud MQTT bridge)

# ==================
# NOTES
# ==================

# Certificate Revocation:
# - Revoked certificates stored in device_certificates.revoked = true
# - Currently no CRL support - revocation requires backend check
# - Future: Implement OCSP or CRL distribution

# Backend Authentication:
# - Backend can use either:
#   1. Client certificate (recommended)
#   2. Password authentication (temporary - separate user)

# Device Provisioning:
# - Devices obtain certificates via HTTPS /api/v1/provisioning/provision-with-certificate
# - Certificates saved to ESP32 SPIFFS
# - First connection uses certificate (no password)
