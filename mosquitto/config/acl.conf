# =====================================================
# Hospital MQTT Access Control List (ACL)
# Certificate-Based Authentication - Day 4
# =====================================================
#
# IMPORTANT: Username comes from certificate Common Name (CN)
# - ESP32 devices: CN = device_id (e.g., "fit-00001", "door-00001")
# - Backend: CN = "hospitalBackend" (if using certificate)
#
# PATTERN SUBSTITUTION:
# - %u = username (device_id from certificate CN)
# - %c = client_id (MQTT client ID, may differ from username)
# - + = single-level wildcard
# - # = multi-level wildcard
#
# =====================================================

# ==================
# BACKEND ACCESS (Full Control)
# ==================

# Backend user with full access to all hospital topics
# Username: hospitalBackend (from certificate CN or password auth)
user hospitalBackend
topic readwrite hospital/#
topic readwrite hospital/devices/+/vitals
topic readwrite hospital/devices/+/alerts
topic readwrite hospital/devices/+/heartbeat
topic readwrite hospital/devices/+/waveform
topic readwrite hospital/devices/+/event
topic readwrite hospital/devices/+/status
topic readwrite hospital/devices/+/assign
topic readwrite hospital/devices/+/command
topic read $SYS/#

# ==================
# ESP32 DEVICE ACCESS (Pattern-Based)
# ==================

# Pattern-based ACL: Each device can only access its own topics
# Username pattern: fit-*, door-*, etc.
# %u substitutes the username (device_id from certificate CN)

# Example: Device with CN=fit-00001 can access:
#   - hospital/devices/fit-00001/vitals (write)
#   - hospital/devices/fit-00001/heartbeat (write)
#   - hospital/devices/fit-00001/command (read)

# VITALS: Devices publish vitals data
pattern write hospital/devices/%u/vitals

# ALERTS: Devices publish critical alerts (ESP32 generates alerts)
pattern write hospital/devices/%u/alerts

# HEARTBEAT: Devices publish periodic keepalive
pattern write hospital/devices/%u/heartbeat

# WAVEFORM: Devices publish ECG/EEG waveform data
pattern write hospital/devices/%u/waveform

# EVENT: Devices publish events (button press, fall detection, etc.)
pattern write hospital/devices/%u/event

# STATUS: Devices publish status updates (battery, connectivity, etc.)
pattern write hospital/devices/%u/status

# COMMAND: Devices receive commands from backend (read-only)
pattern read hospital/devices/%u/command

# ASSIGN: Devices receive patient assignment notifications (read-only)
pattern read hospital/devices/%u/assign

# ==================
# DOOR SCANNER ACCESS (Pattern-Based)
# ==================

# Door scanners publish room entry/exit events
# Username pattern: door-*

# DOOR EVENTS: Door scanners publish BLE device detections
pattern write hospital/door/%u/detection

# DOOR STATUS: Door scanners publish status
pattern write hospital/door/%u/status

# DOOR COMMAND: Door scanners receive commands (read-only)
pattern read hospital/door/%u/command

# ==================
# SECURITY RULES
# ==================

# Default deny: Any topic not explicitly allowed above is denied
# No catch-all rules - principle of least privilege

# Devices CANNOT:
# - Read other devices' topics
# - Write to command topics (only backend can)
# - Read system topics ($SYS/#)
# - Publish to hospital/* root topics

# ==================
# EXAMPLES OF WHAT THIS ALLOWS
# ==================

# Device: fit-00001 (CN from certificate)
# ✅ ALLOWED:
#   - PUBLISH hospital/devices/fit-00001/vitals
#   - PUBLISH hospital/devices/fit-00001/alerts
#   - SUBSCRIBE hospital/devices/fit-00001/command
#
# ❌ DENIED:
#   - PUBLISH hospital/devices/fit-00002/vitals (different device)
#   - SUBSCRIBE hospital/devices/fit-00001/vitals (can only write)
#   - PUBLISH hospital/patients/PAT001/vitals (wrong topic structure)

# Device: door-00001 (CN from certificate)
# ✅ ALLOWED:
#   - PUBLISH hospital/door/door-00001/detection
#   - SUBSCRIBE hospital/door/door-00001/command
#
# ❌ DENIED:
#   - PUBLISH hospital/devices/door-00001/vitals (wrong topic type)
#   - PUBLISH hospital/door/door-00002/detection (different door)

# Backend: hospitalBackend
# ✅ ALLOWED:
#   - Full access to all hospital/* topics
#   - Read system metrics ($SYS/#)
#   - Command any device
