version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hospital_postgres
    environment:
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital123
      POSTGRES_DB: hospitaldb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospitaldb"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: hospital_timescaledb
    environment:
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital123
      POSTGRES_DB: hospitaltimescale
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospitaltimescale"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:1.6
    container_name: hospital_mosquitto
    ports:
      - "8883:8883"  # TLS MQTT
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - ./mosquitto/data:/mosquitto/data
    restart: unless-stopped
    # Healthcheck disabled - certificate-based auth requires client certificate
    # Manual check: docker logs hospital_mosquitto
    # healthcheck:
    #   test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/hospital_ca.crt --cert /path/to/client.crt --key /path/to/client.key -t '$$SYS/#' -C 1 || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

volumes:
  postgres_data:
  timescale_data: