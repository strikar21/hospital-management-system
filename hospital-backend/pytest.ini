[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers for categorizing tests
markers =
    unit: Unit tests (isolated component testing)
    integration: Integration tests (multiple components)
    e2e: End-to-end tests (full workflow testing)
    critical: Critical path tests (P0 - blocking production)
    security: Security tests (authentication, authorization, input validation)
    compliance: Compliance tests (DPDP Act, IMC guidelines, audit trails)
    performance: Performance tests (load testing, query optimization)
    slow: Tests that take > 5 seconds

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if pytest-cov is installed)
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Ignore patterns
norecursedirs = .git .env __pycache__ venv build dist

# Test discovery
minversion = 7.0
