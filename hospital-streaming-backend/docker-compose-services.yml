version: '3.8'

services:
  # MQTT Broker (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: hospital-mosquitto
    ports:
      - "1884:1883"  # Use 1884 to avoid conflicts
      - "9001:9001"  # WebSocket support
    volumes:
      - ./mosquitto-simple.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    restart: unless-stopped
    networks:
      - hospital-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    ports:
      - "6380:6379"  # Use 6380 to avoid conflicts
    command: redis-server --appendonly yes --requirepass hospital_redis_pass
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - hospital-network

  # PostgreSQL (if not already running)
  postgres:
    image: postgres:15
    container_name: hospital-postgres
    environment:
      POSTGRES_DB: hospital_streaming
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - hospital-network

  # TimescaleDB for vitals data
  timescale:
    image: timescale/timescaledb:latest-pg15
    container_name: hospital-timescale
    environment:
      POSTGRES_DB: hospital_vitals
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital_pass
    ports:
      - "5434:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./timescale_init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - hospital-network

volumes:
  mosquitto_data:
  mosquitto_logs:
  redis_data:
  postgres_data:
  timescale_data:

networks:
  hospital-network:
    driver: bridge