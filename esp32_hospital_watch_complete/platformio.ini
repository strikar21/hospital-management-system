[platformio]
src_dir = .

[env:waveshare_amoled]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Exclude old simulator source (no longer used)
build_src_filter = +<*> -<.git/> -<.svn/> -<_unused_simulators/> -<PhysiologicalSimulator.*>

monitor_speed = 115200
upload_speed = 921600

; Waveshare 1.64" AMOLED Display Configuration
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi  ; Matches Arduino IDE: "OPI PSRAM"
board_build.f_cpu = 240000000L

; Build Optimization and Feature Flags
build_flags =
    -O2
    ; LVGL Configuration
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I.
    ; ESP32-S3 Hardware Features
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; ESP-IDF I2C Master Driver
    -D CONFIG_I2C_ENABLE_MASTER=1
    ; Security Features
    -D MBEDTLS_ENABLE_HMAC=1

; Library Dependencies
lib_deps =
    ; Graphics and Display
    lvgl/lvgl@^8.3.11
    ; MQTT Client
    knolleary/PubSubClient@^2.8
    ; JSON Processing
    bblanchon/ArduinoJson@^7.2.0
    ; NFC Reader
    adafruit/Adafruit PN532@^1.3.1
    ; Additional Adafruit Dependencies for PN532
    adafruit/Adafruit BusIO@^1.16.2
    ; MAX30102 HR + SpO2 sensor (replaces PhysiologicalSimulator)
    sparkfun/SparkFun MAX3010x Sensor Library@^1.1.2