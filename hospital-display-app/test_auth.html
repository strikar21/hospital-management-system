<!DOCTYPE html>
<html>
<head>
    <title>Test Authentication</title>
</head>
<body>
    <h1>Authentication Test</h1>
    <button id="testBtn">Test Authentication</button>
    <div id="result"></div>

    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:8001/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        staff_id: 'DOC001',
                        password: 'hospital123'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    result.innerHTML = `<h3>SUCCESS!</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    result.innerHTML = `<h3>FAILED!</h3>Status: ${response.status}`;
                }
            } catch (error) {
                result.innerHTML = `<h3>ERROR!</h3>${error.message}`;
            }
        });
    </script>
</body>
</html>
